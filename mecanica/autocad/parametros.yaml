# Parámetros mecánicos del robot casero — OPCIÓN A (6 nov 2026): UNA sola placa de acrílico, todo encima, sin segundo piso.
# Ver docs/opciones-diseno.md. Los leen generar_dxf.py, generar_3d.py y verificar_dxf.py.
# estado: verificado = reglamento u hoja de datos | escalimetro = medido por Alan, por confirmar con vernier
#         nominal = internet / típico | pendiente = sin fuente, no usar para cortar
# Ejes: origen en el centro del eje de las ruedas, X al frente, Y a la izquierda, Z arriba (piso = 0).

reglamento:
  largo_max_mm: {valor: 200, estado: verificado, id: C03}
  ancho_max_mm: {valor: 100, estado: verificado, id: C03}
  peso_max_g: {valor: 500, estado: verificado, id: C03}

chasis:
  espesor_mm: {acrilico: 3.0, mdf: 3.0, pla: 3.0, estado: pendiente, id: C01}
  kerf_laser_mm: {valor: 0.2, estado: pendiente, id: C05}
  holgura_fdm_mm: {valor: 0.3, estado: pendiente, id: C05}
  densidad_g_cm3: {acrilico: 1.18, mdf: 0.75, pla: 1.24, estado: nominal, id: C04}
  # La cara de arriba de la placa queda a: eje (26.7/2 = 13.35) - medio motor (5) - base del asegurador (1.5, M31) = 6.85 mm (R03)
  z_inferior_mm: 4.5
  delantera: {x1: 20, x2: 70, medio_ancho: 48}    # bajo la placa de sensores
  centro: {x1: -24, x2: 20, medio_ancho: 49}      # zona de motores (con muescas para las ruedas)
  trasera: {x1: -126, x2: -24, medio_ancho: 49}   # bajo la PCB principal
  chaflan_mm: 5
  agujero_tornillo_m3_mm: 3.2

ruedas_y_motores:
  llanta_diametro: {cm: 2.67, mm: 26.7, estado: vernier, id: M08}
  llanta_ancho: {cm: 2.17, mm: 21.7, estado: vernier, id: M08}
  rin_diametro: {cm: 2.1, mm: 21.0, estado: escalimetro, id: M08}
  rin_alto: {cm: 2.2, mm: 22.0, estado: escalimetro, id: M08}
  cara_exterior_llanta_y_mm: 48.0
  motor_largo_mm: {valor: 24.5, estado: referencia, id: M05}
  motor_ancho_mm: {valor: 12, estado: referencia, id: M06}
  motor_alto_mm: {valor: 10, estado: referencia, id: M06}
  eje_largo_mm: {valor: 8.5, estado: referencia, id: M05}
  muesca_rueda_medio_largo_mm: 16
  muesca_rueda_y_interior_mm: 25
  asegurador: {largo_mm: 14, ancho_mm: 16, base_mm: 1.5, sep_agujeros_mm: 19.5, diametro_agujero_mm: 2.2, estado: vernier, id: M31,
               nota: "Alan 11 nov: espesor 1.5 mm y 19.5 mm entre agujeros; largo/ancho siguen SIN FUENTE"}

modulos:
  lipo_2s: {largo_mm: 61, ancho_mm: 16, alto_mm: 15, estado: nominal, id: M14, nota: "va pegada con cinta doble cara encima del ESP32"}
  ventilador_4010: {lado_mm: 40, alto_mm: 10, hueco_mm: 34, separadores_mm: 8, estado: pendiente, id: M21,
                    nota: "atornillado a la PCB principal sobre su hueco; la placa tiene el mismo hueco"}
  tcrt5000: {largo_mm: 10.2, ancho_mm: 5.8, alto_mm: 7, estado: verificado, id: M18}
  sensores: {n: 12, paso_mm: 7.5, radio_arco_mm: 110, altura_al_piso_mm: 2.5, estado: decision, nota: "D05 y opciones-diseno.md"}
  deslizadores: {n: 0, nota: "OBSOLETO (11 nov): se compro rueda loca, ver rueda_loca y R03"}
  rueda_loca: {modelo: "Mini rueda universal 3Pi N20", largo_mm: 22, ancho_mm: 16, alto_mm: 15, sep_agujeros_mm: 15, peso_g: 10, estado: ficha, id: M30,
               nota: "15 mm de alto: no cabe debajo de la placa (queda a ~3.9 mm del piso), ver R03"}

pcbs:
  principal: {x_frente_mm: -20, separadores_mm: 4}
  sensores: {x_frente_mm: 70, separadores_mm: 2, nota: "los sensores atraviesan la placa por ventanas y quedan a 2.5 mm del piso"}
