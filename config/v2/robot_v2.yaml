  motor_kt_Nm_A: {valor: 0.01635, tipo: calculado, fuente: "0.25 kg·cm / 1.5 A en el eje de salida (sin pérdidas de la reductora)"}
  motor_I0_A: {valor: 0.15, tipo: verificado, fuente: "Pololu #5183: corriente sin carga a 6 V (±50 %)"}
  motor_Rth_KW: {valor: 40.0, tipo: estimado, fuente: "resistencia térmica devanado-ambiente de un micromotor de 10 × 12 mm sin disipador (no publicada por Pololu)"}
