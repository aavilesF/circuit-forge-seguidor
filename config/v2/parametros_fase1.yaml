# V2 · Fase 1 — parámetros de los modelos de primer orden (sim/v2/fase1_v2.py).
# NO es la configuración del robot V2 (esa se fija en la Fase 2). Cada valor declara su tipo:
#   calculado | estimado | supuesto (escenario de estudio) | verificado documentalmente | medido en el modelo 3D entregado
#   | pendiente de medición física | pendiente del fabricante
# Los "supuestos" son variables de barrido para ver tendencias: NO son datos del ventilador ni del robot.

reglamento:
  radio_min_linea: {valor: 0.15, tipo: verificado documentalmente, fuente: "Reglamento RMX2026, pista P03 (docs/REGLAMENTO_MATRIZ.md)"}
  caja_m: {valor: [0.20, 0.10], tipo: verificado documentalmente, fuente: "R01: 20 × 10 cm (largo × ancho), sin límite de altura"}
  masa_max_kg: {valor: 0.500, tipo: verificado documentalmente, fuente: "R03: 500 g en todo momento"}

aire:
  altitud_m: {valor: 1815, tipo: verificado documentalmente, fuente: "León, Gto. (sede del evento): 1,815 m, en.wikipedia.org/wiki/León,_Guanajuato"}

estudio:
  masas_kg: {valor: [0.15, 0.20, 0.25], tipo: supuesto, fuente: "rango V2: V1 en CAD 0.113 kg + módulo de succión, motor, controlador y batería mayores"}
  masa_ref_kg: {valor: 0.20, tipo: supuesto, fuente: "punto central del rango"}
  mu: {valor: [0.6, 0.8, 1.0], tipo: supuesto, fuente: "llanta-fórmica sin medir (P01, medición M1)"}
  mu_ref: {valor: 0.8, tipo: supuesto, fuente: "el mismo valor que usó V1; pendiente de medición física"}
  radios_m: {valor: [0.15, 0.20, 0.30, 0.50], tipo: supuesto, fuente: "0.15 es el mínimo del reglamento; los demás son radios típicos"}
  velocidades_ms: {valor: [1.0, 1.5, 2.0], tipo: supuesto, fuente: "2.0 m/s es la meta de diseño en recta"}
  F_succion_N: {valor: [0.0, 0.5, 1.0, 2.0, 3.0, 4.0, 6.0], tipo: supuesto, fuente: "barrido"}
  x_succion_m: {valor: [0.0, 0.03, 0.06], tipo: supuesto, fuente: "centro de presión de la cámara respecto al eje de ruedas"}
  cuellos_m: {valor: [0.08, 0.11, 0.14], tipo: supuesto, fuente: "0.11 = V1; L < R_min = 0.15 para que el eje pueda seguir la curva más cerrada"}
  radios_anticipacion_m: {valor: [0.15, 0.30], tipo: supuesto, fuente: "peor caso y caso medio"}
  latencias_s: {valor: [0.005, 0.010, 0.020], tipo: supuesto, fuente: "lectura + control + respuesta eléctrica del motor"}
  umbral_deteccion_m: {valor: [0.002, 0.004], tipo: supuesto, fuente: "desviación lateral de la línea que el firmware distingue del ruido"}
  deceleraciones_ms2: {valor: [5, 10, 15, 20], tipo: supuesto, fuente: "barrido"}
  rpm_ventilador: {valor: [10000, 15000, 20000, 25000, 30000, 40000], tipo: supuesto, fuente: "barrido: las RPM reales dependen del motor del ventilador, no informado"}

geometria_estudio:          # geometría de ESTUDIO: no es el diseño V2 (Fase 3)
  b_apoyo_m: {valor: 0.10, tipo: supuesto, fuente: "distancia eje de ruedas - apoyo delantero (V1: 0.092)"}
  x_cg_m: {valor: 0.025, tipo: supuesto, fuente: "CG delante del eje (V1 en CAD: 0.020)"}
  h_cg_m: {valor: 0.020, tipo: supuesto, fuente: "V1 en CAD: 0.0154; el módulo de succión lo sube"}
  via_m: {valor: 0.085, tipo: supuesto, fuente: "V1: 0.085"}
  x_succion_m: {valor: 0.03, tipo: supuesto, fuente: "cámara centrada 30 mm delante del eje"}

ventilador:                 # rotor entregado (VentiladorATS1.obj): rueda centrífuga cerrada de álabes radiales
  r1_m: {valor: 0.010, tipo: medido en el modelo 3D entregado, fuente: "radio interior de los álabes = radio del ojo de entrada (Ø20)"}
  r2_m: {valor: 0.017, tipo: medido en el modelo 3D entregado, fuente: "radio exterior (Ø34)"}
  b2_m: {valor: 0.006, tipo: medido en el modelo 3D entregado, fuente: "altura de los álabes"}
  z_alabes: {valor: 12, tipo: medido en el modelo 3D entregado, fuente: "12 álabes rectos radiales de 1.0 mm"}
  sigma_presion: {valor: [0.6, 0.9], tipo: supuesto, fuente: "fracción de la presión ideal que llega a la cámara (deslizamiento y pérdidas)"}
  phi_caudal: {valor: [0.10, 0.25], tipo: supuesto, fuente: "coeficiente de caudal libre de orden típico"}
  escenarios_curva: {valor: [[400, 0.004], [800, 0.006], [1200, 0.008]], tipo: supuesto,
                     fuente: "[ΔP0 Pa a la densidad de León, Q0 m³/s] SOLO para barrer; reemplazar con la curva del fabricante"}

modulo:                     # Base, pilares y soporte entregados
  A_entrada_m2: {valor: 2.717e-4, tipo: medido en el modelo 3D entregado, fuente: "agujero de la base: Ø18.6 mm en la garganta (Ø24.4 en la cara inferior)"}

camara:
  escenarios: {valor: [["C0 base entregada", 0.0318, 0.0318], ["C1 50×50", 0.050, 0.050], ["C2 70×70", 0.070, 0.070],
                       ["C3 90×75", 0.090, 0.075]], tipo: supuesto,
               fuente: "C0 = cara inferior de la base entregada (31.8 × 31.8 mm); C1-C3 = cámaras con faldón propuestas"}
  ranuras_m: {valor: [0.0003, 0.0005, 0.0010, 0.0015, 0.0020], tipo: supuesto, fuente: "ranura entre el faldón y la fórmica; pendiente de medición física"}
  Cd_ranura: {valor: 0.6, tipo: supuesto, fuente: "coeficiente de descarga de una ranura de borde vivo"}
  labio_m: {valor: 0.002, tipo: supuesto, fuente: "ancho del labio del faldón"}
  K_entrada: {valor: 1.0, tipo: supuesto, fuente: "pérdida del conducto de entrada en cargas dinámicas"}

bateria:
  V_llena: {valor: 8.4, tipo: calculado, fuente: "2S × 4.2 V"}
  V_nominal: {valor: 7.4, tipo: calculado, fuente: "2S × 3.7 V"}
  V_baja: {valor: 7.0, tipo: supuesto, fuente: "2S × 3.5 V, final de una carrera"}
  R_interna_ohm: {valor: 0.20, tipo: supuesto, fuente: "V1 (config/robot_maestro.yaml), pendiente de medición M4"}

fallos:
  camara_m: {valor: [0.070, 0.070], tipo: supuesto, fuente: "escenario C2"}
  ranura_m: {valor: 0.0005, tipo: supuesto, fuente: "escenario"}
  ventilador: {valor: [800, 0.006], tipo: supuesto, fuente: "escenario intermedio de la curva (NO es un dato)"}
  cuello_m: {valor: 0.11, tipo: supuesto, fuente: "V1"}
  factor_plan: {valor: 0.9, tipo: supuesto, fuente: "el control usa 90 % de la adherencia disponible en curva"}
  tau_caida_s: {valor: [0.05, 0.10, 0.20, 0.40], tipo: supuesto, fuente: "constante de tiempo de la caída de presión al cortar el ventilador"}

energia:
  niveles: {valor: [["sin ventilador", 0.0], ["reducida", 0.5], ["intermedia", 0.75], ["máxima", 1.0]], tipo: supuesto,
            fuente: "fracción de las RPM máximas: ΔP ∝ RPM², Q ∝ RPM, P ∝ RPM³ (leyes de semejanza)"}
  P_ventilador_max_W: {valor: [5, 10, 20], tipo: supuesto, fuente: "potencia eléctrica máxima del ventilador: pendiente del fabricante"}
  cuello_m: {valor: 0.11, tipo: supuesto, fuente: "V1"}
  latencia_s: {valor: 0.010, tipo: supuesto, fuente: "escenario"}
  umbral_m: {valor: 0.002, tipo: supuesto, fuente: "escenario"}
  v_tope_ms: {valor: 2.0, tipo: supuesto, fuente: "meta de diseño"}
  a_acc_motor_ms2: {valor: 10.0, tipo: supuesto, fuente: "límite de aceleración por par de motor (los motores V2 se eligen en la Fase 2)"}
  sin_ventilador_quita_masa: {valor: false, tipo: supuesto, fuente: "el escenario 'sin ventilador' conserva la masa del módulo (ventilador apagado)"}

motor_req:
  diametros_m: {valor: [0.028, 0.032, 0.040], tipo: supuesto, fuente: "diámetros de llanta candidatos"}
