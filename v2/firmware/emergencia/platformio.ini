; Robot de EMERGENCIA · firmware vigente (v2/firmware/emergencia).
; Uso:  cd v2/firmware/emergencia  &&  pio run -e esp32dev -t upload  &&  pio device monitor
; Arduino IDE: abrir v2/firmware/emergencia/emergencia/emergencia.ino, placa "ESP32 Dev Module".
[platformio]
src_dir = emergencia
default_envs = esp32dev

[base]
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = -Wall -Wextra

; Núcleo arduino-esp32 3.x (el que instala hoy Arduino IDE por defecto)
[env:esp32dev]
extends = base
platform = espressif32@8.0.0

; Núcleo arduino-esp32 2.0.17 (por si la PC del equipo tiene el núcleo 2.x)
[env:esp32dev_nucleo2]
extends = base
platform = espressif32@6.9.0
