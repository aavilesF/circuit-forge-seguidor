# Configuración maestra del Speed Follower (Circuit Forge, RMX2026).
# ÚNICA fuente de parámetros para cálculos, simulador, firmware y CAD.
# Cada valor lleva su origen:
#   [R]  Reglamento oficial RMX2026 (consultado 1 nov 2026)
#   [F]  Fabricante / hoja de datos
#   [FX] Fabricante, valor extrapolado por el propio fabricante
#   [E]  Estimado (cálculo o geometría sin medir)
#   [S]  Supuesto de diseño (sin fuente; debe medirse)
#   [D]  Decisión de diseño (variable que elegimos)
# Unidades SI salvo que se indique.

version: 1

reglamento:                       # [R] reglamento-seguidor-linea.html
  largo_max: 0.200                # caja 20 x 10 cm, sin límite de altura
  ancho_max: 0.100
  masa_max: 0.500                 # en ningún momento; exceder = descalificación
  tablero: [2.44, 1.22]           # MDF + fórmica blanca mate
  ancho_linea: 0.025              # vinil negro
  radio_min_linea: 0.150          # "radio mayor de 15 cm"
  hueco_max: 0.005                # discontinuidades de hasta 5 mm
  separacion_min: 0.20            # entre líneas de la pista
  t_preparacion: 15.0             # s para calibrar y colocar
  t_max_intento: 300.0            # s
  primer_metro: 1.0               # m: dentro de él se permite un reinicio

diseno:
  masa_limite_diseno: 0.450       # [D] 50 g de margen bajo el límite del reglamento
  margen_caja: 0.004              # [D] holgura por lado contra la caja de homologación

geometria:                        # [D] valores base; el barrido de CALCULOS los evalúa
  L_cuello: 0.100                 # eje de ruedas -> centro de la barra
  W_via: 0.085                    # separación entre centros de llanta
  D_llanta: 0.034                 # [E] llanta 34 x 7 (medir)
  ancho_llanta: 0.007

traccion:
  mu: 0.80                        # [S] llanta-fórmica; MEDIR con plano inclinado
  f_motriz: 0.66                  # [E] fracción del peso sobre las ruedas (auditoría H09)
  c_rodadura: 0.015               # [S] resistencia de rodadura equivalente (fracción del peso)
  apoyo_lateral: false            # apoyo de bola: no aporta fuerza lateral

succion:                          # opción, no decidida
  F_down_gf: 0                    # [D] fuerza de succión en gramos-fuerza (MEDIR con báscula)
  f_down_motriz: 0.90             # [S] fracción de la succión que cae sobre las ruedas
  masa_extra: 0.030               # [S] ventilador + controlador + cableado (sin modelo elegido)

bateria:
  celdas: 2                       # [D] LiPo 2S
  V_llena: 8.40                   # [F] 4.20 V/celda
  V_nominal: 7.40                 # [F]
  V_baja: 6.80                    # [D] 3.40 V/celda: umbral de parada
  R_interna: 0.20                 # [S] paquete + cableado + interruptor + fusible (MEDIR)
  I_logica: 0.30                  # [E] ESP32 + sensores + regulador

masa:                             # [E] presupuesto inicial (ENTREGABLE_2 §4); kg
  mcu: 0.011
  bateria: 0.036
  motores: 0.022
  llantas: 0.0064
  apoyo: 0.010
  barra_sensores: 0.0055
  electronica_varios: 0.020
  chasis: 0.044                   # peor caso del STL anterior, 100 % de relleno

control:
  T_ctrl: 0.002                   # [D] periodo del firmware actual (2 ms)
  paso_sensor: 0.008              # [D]
  n_sensores: 12                  # [D]

conductor:                        # driver de motores
  modelo: DRV8833                 # [D] alternativa TB6612FNG
  VM_max_recomendado: 10.8        # [F] TI SLVSAR1E
  VM_max_absoluto: 11.8           # [F]
  I_rms_PWP: 1.5                  # [F] por puente, encapsulado PWP/RTY
  I_rms_PW: 0.5                   # [F] encapsulado PW (TSSOP)
  I_pico: 2.0                     # [F]
  TB6612_VM_max_recomendado: 13.5 # [F]
  TB6612_VM_max_absoluto: 15.0    # [F]
  TB6612_I_canal: 1.0             # [F] promedio recomendado

# Motores: datos tabulados por Pololu para micro metal gearmotors.
# V_nom, rpm libre, par de bloqueo (kg·cm), I bloqueo, I sin carga, masa.
# Pololu indica que los datos de bloqueo a 12 V son extrapolados ([FX]).
motores:
  pololu_hpcb12_10:
    nombre: "Pololu HPCB 12V 10:1"
    V_nom: 12.0
    rpm: 3400
    par_kgcm: 0.17
    I_bloqueo: 0.75
    I_vacio: 0.08
    masa: 0.0095
    limite_V: null
    origen: "[F] rpm/I_vacio; [FX] par e I de bloqueo"
  pololu_hpcb12_15:
    nombre: "Pololu HPCB 12V 15:1"
    V_nom: 12.0
    rpm: 2200
    par_kgcm: 0.25
    I_bloqueo: 0.75
    I_vacio: 0.08
    masa: 0.0095
    limite_V: null
    origen: "[F] rpm/I_vacio; [FX] par e I de bloqueo"
  pololu_hpcb6_10:
    nombre: "Pololu HPCB 6V 10:1 (PWM limitado a 6 V)"
    V_nom: 6.0
    rpm: 3300
    par_kgcm: 0.17
    I_bloqueo: 1.5
    I_vacio: 0.15
    masa: 0.0095
    limite_V: 6.0
    origen: "[F] tabla Pololu"
  pololu_hpcb6_15:
    nombre: "Pololu HPCB 6V 15:1 (PWM limitado a 6 V)"
    V_nom: 6.0
    rpm: 2100
    par_kgcm: 0.25
    I_bloqueo: 1.5
    I_vacio: 0.17
    masa: 0.0095
    limite_V: 6.0
    origen: "[F] tabla Pololu"
  pololu_hpcb6_30:
    nombre: "Pololu HPCB 6V 30:1 (PWM limitado a 6 V)"
    V_nom: 6.0
    rpm: 1100
    par_kgcm: 0.45
    I_bloqueo: 1.5
    I_vacio: 0.17
    masa: 0.0095
    limite_V: 6.0
    origen: "[F] tabla Pololu"

motor_base: pololu_hpcb12_15      # [D] elección vigente (SF-2), se revisa con estos cálculos
