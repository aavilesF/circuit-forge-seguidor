; Robot casero (Plan B) · firmware V3.  Uso:  cd firmware/robot-casero && pio run -t upload && pio device monitor
; Arduino IDE: abrir firmware/robot-casero/casero/casero.ino, placa "ESP32 Dev Module" (núcleo esp32 2.0.x o 3.x).
[platformio]
src_dir = casero

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
